<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AudioCron – Audiobook-Log</title>
  <meta name="description" content="Zentrale Verwaltung gehörter Hörbücher über BookBeat, Borrow Box und mehr.">
  <meta name="theme-color" content="#12161f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js" defer></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="topbar-title">AudioCron</div>
      <div id="topbar-actions"></div>
    </header>
    <main id="view"></main>
    <nav id="bottomnav">
      <button data-route="library" class="nav-btn active" aria-label="Bibliothek">
        <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.6l3.8 1-3.2 14.2-3.8-1z" fill="currentColor"/></svg>
        <span>Bibliothek</span>
      </button>
      <button data-route="stats" class="nav-btn" aria-label="Statistik">
        <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z" fill="currentColor"/></svg>
        <span>Statistik</span>
      </button>
      <button data-route="settings" class="nav-btn" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 .05-1 7.6 7.6 0 0 0-.05-1l2.1-1.6a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65a.5.5 0 0 0-.5-.42h-4a.5.5 0 0 0-.5.42l-.38 2.65a7.3 7.3 0 0 0-1.73 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.55 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.12.64l2 3.46c.13.24.4.33.61.22l2.49-1c.53.41 1.11.75 1.73 1l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65a7.3 7.3 0 0 0 1.73-1l2.49 1c.22.11.49.02.61-.22l2-3.46a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z" fill="currentColor"/></svg>
        <span>Einstellungen</span>
      </button>
    </nav>
    <button id="fab" aria-label="Hinzufügen">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor"/></svg>
    </button>
  </div>
  <div id="sheet-backdrop" class="hidden"></div>
  <div id="sheet" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</body>
</html>
